<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Off the mapped path | Yogeshwaran Muthuraman</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@200..700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #1c2033; --paper: #e9ebfa; --accent: #7a5d00; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        background: var(--paper); color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif; padding: 24px;
      }
      main { max-width: 56ch; text-align: center; }
      p.kicker {
        font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.22em;
        text-transform: uppercase; color: var(--accent); margin: 0 0 22px;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif; font-weight: 300; letter-spacing: -0.04em;
        font-size: clamp(4.5rem, 16vw, 9rem); line-height: 0.9; margin: 0 0 18px;
      }
      p.lede { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 1.35rem; margin: 0 0 12px; }
      p.copy { color: color-mix(in srgb, var(--ink) 68%, var(--paper)); line-height: 1.7; margin: 0 0 34px; }
      a.btn {
        display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 28px;
        border-radius: 999px; background: var(--ink); color: var(--paper);
        font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em;
        text-transform: uppercase; text-decoration: none;
      }
      a.btn:hover { background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Off the mapped path // 404</p>
      <h1>404</h1>
      <p class="lede">This coordinate isn't in the archive.</p>
      <p class="copy">The page you were looking for doesn't exist here — but the nine-chapter journey is one tap away.</p>
      <a class="btn" href="./">Return to the journey &rarr;</a>
    </main>
  </body>
</html>
