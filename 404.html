<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070706">
<title>404 — Void Coordinate | Yogeshwaran Muthuraman</title>
<link rel="icon" href="icon.png">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<style>
body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--pad);
  background: var(--void);
}
.error-vault {
  max-width: 580px;
  width: 100%;
  border: 1px solid var(--border-idle);
  background: rgba(13,12,10,.85);
  padding: clamp(32px, 6vw, 64px);
  position: relative;
}
.error-vault::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 0;
  width: 64px;
  height: 2px;
  background: var(--brass);
}
.error-code {
  font-family: var(--font-display);
  font-size: clamp(4rem, 12vw, 7.5rem);
  line-height: .9;
  color: var(--brass);
  margin-bottom: 18px;
}
.error-title {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 3vw, 2.2rem);
  margin-bottom: 16px;
  color: var(--soft-white);
}
.error-desc {
  color: #BAAA98;
  font-size: 14.5px;
  line-height: 1.7;
  margin-bottom: 32px;
}
</style>
</head>
<body>
  <div class="error-vault">
    <div class="tag"><s></s>Archival Anomaly // 404</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Coordinate unmapped in the archive.</h1>
    <p class="error-desc">The requested sector or document does not exist in this index. Return to the primary chamber to resume spatial navigation.</p>
    <a class="btn btn-primary" href="./index.html">Return to Archive</a>
  </div>
</body>
</html>
